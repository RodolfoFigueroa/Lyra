[project]
name = "lyra-api"
version = "0.14.0"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.13.5",
    "geopandas>=1.1.3",
    "lyra-sdk>=0.11.0",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[project.scripts]
lyra-admin = "lyra.api.admin_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyra"]

[tool.uv.sources]
lyra-sdk = { workspace = true }
