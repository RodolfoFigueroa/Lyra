name: Validate documentation
on:
  workflow_call:
    inputs:
      source-commit:
        type: string
        required: true
      upload:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-commit }}
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Validate documentation
        env:
          LYRA_DOCS_BASE: /Lyra/latest
          LYRA_DOCS_REF: main
        working-directory: docs
        run: |
          npm ci
          npm run ci


      - name: Record artifact identity
        if: inputs.upload
        env:
          SOURCE_SHA: ${{ inputs.source-commit }}
        run: |
          echo "$SOURCE_SHA" > docs/dist/source-sha.txt
          echo /Lyra/latest > docs/dist/source-base.txt
      - name: Upload validated Latest
        if: inputs.upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docs-latest-${{ inputs.source-commit }}
          path: docs/dist
          retention-days: 14
          overwrite: true
