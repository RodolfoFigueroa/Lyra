name: Publish Lyra release

on:
  workflow_call:
    inputs:
      source-commit:
        type: string
        required: true
      pr-number:
        type: string
        required: true

concurrency:
  group: publish-release-main
  queue: max
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      state: ${{ steps.existing.outputs.state }}

    steps:
      - name: Check out the merged release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-commit }}

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Build the immutable release plan
        id: release
        env:
          RELEASE_SHA: ${{ inputs.source-commit }}
        run: |
          if [[ "$GITHUB_SHA" != "$RELEASE_SHA" ]]; then
            echo "Docker event commit differs from release commit" >&2
            exit 1
          fi
          BASE_SHA="$(git rev-parse "${RELEASE_SHA}^1")"
          uv run --no-project --python 3.11 -m build_scripts.release plan \
            --base-ref "$BASE_SHA" \
            --head-ref "$RELEASE_SHA" \
            --output-dir "${RUNNER_TEMP}/lyra-release" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check for a previous publication before pushing image tags
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.commit }}
        run: |
          state=$(bash build_scripts/release-state.sh "$TAG" "$RELEASE_SHA")
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Upload the release plan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lyra-release-plan
          path: ${{ runner.temp }}/lyra-release
          if-no-files-found: error
          overwrite: true

  publish-app-image:
    if: needs.plan.outputs.state != 'published'
    needs:
      - plan
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790 # v1
    permissions:
      contents: read
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      distribute: true
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      cache: true
      cache-mode: max
      cache-scope: lyra
      sign: "false"
      meta-images: ghcr.io/${{ github.repository_owner }}/lyra
      meta-tags: |
        type=raw,value=${{ needs.plan.outputs.version }}
        type=raw,value=latest
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  publish-github-release:
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.publish-app-image.result == 'success' ||
       (needs.plan.outputs.state == 'published' && needs.publish-app-image.result == 'skipped'))
    needs:
      - plan
      - publish-app-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the immutable release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.commit }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Download the release plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: lyra-release-plan
          path: ${{ runner.temp }}/lyra-release

      - name: Publish the tag and release from the validated plan
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PLANNED_STATE: ${{ needs.plan.outputs.state }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.commit }}
        shell: bash
        run: |
          plan_dir="${RUNNER_TEMP}/lyra-release"
          jq -e --arg tag "$TAG" --arg version "$VERSION" --arg sha "$RELEASE_SHA" \
            '.name == "lyra" and .tag == $tag and .version == $version and .commit == $sha' \
            "$plan_dir/release-manifest.json" >/dev/null
          state=$(bash build_scripts/release-state.sh "$TAG" "$RELEASE_SHA")
          if [[ "$state" == published ]]; then
            gh release download "$TAG" --pattern release-manifest.json --output "$RUNNER_TEMP/published.json"
            cmp "$plan_dir/release-manifest.json" "$RUNNER_TEMP/published.json"
            exit 0
          fi
          test "$PLANNED_STATE" != published
          if [[ "$state" == untagged ]]; then
            git push origin "${RELEASE_SHA}:refs/tags/${TAG}"
          fi
          if [[ "$state" != draft ]]; then
            gh release create "$TAG" --verify-tag --target "$RELEASE_SHA" --draft \
              --title "Lyra $TAG" --notes-file "$plan_dir/release-notes.md"
          fi
          gh release upload "$TAG" "$plan_dir/release-manifest.json" --clobber
          gh release edit "$TAG" --draft=false --prerelease=false --latest

  finalize:
    if: ${{ !cancelled() && needs.publish-github-release.result == 'success' }}
    needs:
      - publish-github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Mark the release PR as published
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label 'autorelease: tagged' \
            --repo "$GITHUB_REPOSITORY"
          labels=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')
          if grep -Fxq 'autorelease: pending' <<<"$labels"; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/autorelease%3A%20pending"
          fi

  publish-docs:
    if: ${{ !cancelled() && needs.finalize.result == 'success' }}
    needs: finalize
    uses: ./.github/workflows/docs-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      source-commit: ${{ inputs.source-commit }}
      refresh: true
