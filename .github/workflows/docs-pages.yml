name: Deploy released and development documentation

on:
  workflow_call:
    inputs:
      source-commit:
        type: string
        required: true
      refresh:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deploy-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
      release-sha: ${{ steps.release.outputs.sha }}
      eligible: ${{ steps.latest.outputs.eligible }}
      source-sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Select Latest source
        id: latest
        env:
          INPUT_SHA: ${{ inputs.source-commit }}
          REFRESH: ${{ inputs.refresh || github.event_name == 'workflow_dispatch' }}
        run: |
          current=$(git rev-parse HEAD)
          if [[ "$current" == "$INPUT_SHA" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REFRESH" == "true" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped obsolete documentation request." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download validated Latest
        if: steps.latest.outputs.reuse == 'true'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: docs-latest-${{ inputs.source-commit }}
          path: docs/dist
      - name: Verify artifact identity
        if: steps.latest.outputs.reuse == 'true'
        env:
          INPUT_SHA: ${{ inputs.source-commit }}
        run: |
          test "$(cat docs/dist/source-sha.txt)" = "$INPUT_SHA"
          test "$(cat docs/dist/source-base.txt)" = /lyra/latest
          echo "Reused validated Latest artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Validate documentation
        if: steps.latest.outputs.eligible == 'true' && steps.latest.outputs.reuse != 'true'
        env:
          LYRA_DOCS_BASE: /lyra/latest
          LYRA_DOCS_REF: main
        working-directory: docs
        run: |
          npm ci
          npm run ci

      - name: Record source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select published product release
        id: release
        if: steps.latest.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          tag=$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name' <<<"$release")
          [[ "$tag" =~ ^lyra-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "$tag^{commit}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Documentation release: $tag ($sha); main: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble released and development documentation
        if: steps.latest.outputs.eligible == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          echo "$SOURCE_SHA" > docs/dist/source-sha.txt
          echo /lyra/latest > docs/dist/source-base.txt
          uv run --frozen --group dev python -m docs.scripts.versioned_site \
            --output docs-site --latest-sha "$SOURCE_SHA" --latest-build docs/dist \
            --release-tag "$RELEASE_TAG" --release-sha "$RELEASE_SHA"

      - name: Check assembled links
        if: steps.latest.outputs.eligible == 'true'
        run: uv run --frozen python -c 'from pathlib import Path; from docs.scripts.check_site import broken_links; failures = broken_links(Path("docs-site"), "/lyra"); print("\n".join(failures)); raise SystemExit(bool(failures))'

      - name: Upload the Pages artifact
        if: steps.latest.outputs.eligible == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs-site

  deploy:
    if: needs.build.outputs.eligible == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.11"
      - name: Check source freshness
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release-sha }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$current" == "$SOURCE_SHA" && "$tag" == "$RELEASE_TAG" && "$sha" == "$RELEASE_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped superseded documentation build." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to GitHub Pages
        if: steps.fresh.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
