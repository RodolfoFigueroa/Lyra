[project]
name = "lyra-smoke-plugin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lyra[sdk]",
    "geopandas>=1.1.3",
    "pandas>=2.3.3",
    "pandera[geopandas,pandas]>=0.35,<0.36",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.2",
    "typing-extensions>=4.15.0",
]

[tool.uv.sources]
lyra = { path = "../..", editable = true }

[tool.lyra]
factory = "smoke_plugin.plugin:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smoke_plugin"]

[tool.hatch.build.targets.wheel.shared-data]
"lyra.plugin.json" = "share/lyra/plugins/lyra-smoke-plugin/lyra.plugin.json"

[tool.hatch.build.targets.sdist]
include = ["smoke_plugin", "lyra.plugin.json", "pyproject.toml"]
