[project]
name = "lyra-location-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lyra[sdk]",
    "geopandas>=1.1.3",
    "pandas>=2.3.3",
    "pandera[geopandas,pandas]>=0.35,<0.36",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = ["lyra[client,runtime]"]

[tool.uv.sources]
lyra = { path = "../..", editable = true }

[tool.lyra]
factory = "location_plugin:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["location_plugin"]

[tool.hatch.build.targets.wheel.shared-data]
"lyra.plugin.json" = "share/lyra/plugins/lyra-location-example/lyra.plugin.json"
