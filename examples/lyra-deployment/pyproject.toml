[project]
name = "lyra-deployment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["lyra[server]", "lyra-city-example"]

[tool.uv]
package = false

# This executable example uses checked-out source. In a deployment repository,
# replace these sources with Git revisions and regenerate this project's lockfile.
[tool.uv.sources]
lyra = { path = "../..", editable = true }
lyra-city-example = { path = "../city-plugin" }
