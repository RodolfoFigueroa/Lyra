# Copy this file to /lyra_data/config/lyra.toml and adjust values for your
# deployment. PostgreSQL passwords and the separate admin and agent API keys
# are supplied through environment variables, not this TOML file.
# LYRA_AGENT_API_KEY authenticates MCP and every /jobs lifecycle route.

schema_version = 4

[api]
host = "0.0.0.0"
port = 5219
# Agents use this operator-controlled URL for authenticated result downloads.
# Replace this loopback development value with the public HTTPS URL in production.
public_base_url = "http://localhost:5219"
# Trust forwarded scheme/client headers only from these reverse-proxy source
# IPs or CIDRs. Keep the loopback default for a host-local proxy; use the exact
# container-network CIDR when the proxy runs in another container.
forwarded_allow_ips = ["127.0.0.1"]

[redis]
# The checked-in value targets docker/docker-compose-dev.yml.
# For a production Compose service named lyra-redis, use redis://lyra-redis:6379/0.
# For direct local processes, use redis://localhost:6379/0.
url = "redis://redis:6379/0"

[database]
host = "replace-with-reachable-postgis-host"
port = 5432
name = "lyra"
user = "lyra"
readiness_timeout_seconds = 1.0
retry_after_seconds = 5

[database.api]
pool_size = 5
max_overflow = 0
pool_timeout_seconds = 2.0
connect_timeout_seconds = 5
statement_timeout_ms = 10000
pool_recycle_seconds = 900

[database.spatial]
pool_size = 2
max_overflow = 0
pool_timeout_seconds = 2.0
connect_timeout_seconds = 5
statement_timeout_ms = 25000
pool_recycle_seconds = 900

[database.worker]
pool_size = 1
max_overflow = 0
pool_timeout_seconds = 5.0
connect_timeout_seconds = 5
statement_timeout_ms = 300000
pool_recycle_seconds = 900


[logging]
level = "INFO"
# Lyra writes one JSON object per line. Set file to write there instead of stdout.
# file = "/lyra_data/logs/lyra.log"

[jobs]
execution_timeout_seconds = 18000
progress_min_interval_ms = 1000
result_retention_seconds = 86400


[mcp]
enabled = true
mount_path = "/mcp"

[plugins]
default_queue = "interactive"
allowed_queues = ["interactive", "batch"]
[[plugins.installed]]
distribution = "lyra-smoke-plugin"

[workers.interactive]
queues = ["interactive"]
concurrency = 4
# temp_dir = "/lyra_data/cache/jobs/interactive"

[workers.batch]
queues = ["batch"]
concurrency = 2
# temp_dir = "/lyra_data/cache/jobs/batch"
